# Gera a app Ubuntu (.deb e .AppImage) e o site, e publica-os numa
# Release do GitHub com SHA256SUMS. Corre com:  git tag v1.1.2 && git push --tags
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: App Ubuntu
        run: cd desktop && ./build-ubuntu.sh
      - name: Site
        run: node tools/build-web.js && (cd dist-web && zip -qr ../topcatswap-web-${GITHUB_REF_NAME}.zip .)
      - name: Checksums
        run: |
          mkdir out
          cp desktop/dist/*.deb desktop/dist/*.AppImage topcatswap-web-*.zip out/
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
